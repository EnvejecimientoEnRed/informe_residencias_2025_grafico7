
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Centros residenciales según tipo</title>
<!-- =================================================
     1. ESTILOS GENERALES DE LA PÁGINA (CSS)

     Se mantienen los mismos criterios visuales en todos los mapas:
     tipografía, colores, márgenes y anchura.
================================================== -->
<style>
    /* Configuración general */
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 10px 20px;
        background: #ffffff;
        color: #333333;
    }
    /* Contenedor principal: centra el contenido */
    .contenedor {
        max-width: 1100px;
        margin: auto;
    }
    /* CABECERA: título a la izquierda y logo a la derecha */
    .cabecera {
        margin-top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 10px;
    }
    /* Formato del título */
    .cabecera h1 {
        font-size: 25px;
        margin: 0 0 10px 0;
    }
    /* Formato de la fecha */
    .cabecera h4 {
        margin: 0;
        font-weight: normal;
        color: #666666;
    }
    /* Dimensiones del logotipo */
    .cabecera img {
        max-width: 147px;
        max-height: 87px;
        object-fit: contain;
    }
    /* Texto descriptivo */
    .descripcion {
        color: #666666;
        margin-bottom: 18px;
    }
    /* CONTENEDOR DEL MAPA */
    .mapa {
        width: 100%;
    }
    /* Ajustes del mapa de Datawrapper */
    .mapa iframe {
        width: 0;
        min-width: 100% !important;
        border: none;
    }
    /* Adaptación a pantallas pequeñas */
    @media (max-width: 600px) {
        .cabecera h1 {
            font-size: 20px;
        }
        .cabecera img {
            max-width: 100px;
        }
    }
</style>
</head>

<body>

<!-- =================================================
     2. CONTENEDOR PRINCIPAL
================================================== -->

<div class="contenedor">

    <!-- =================================================
         3. CABECERA

         Título, fecha de referencia y logotipo.
         El archivo logo.png debe estar en la misma
         carpeta que este index.html.
    ================================================== -->

    <div class="cabecera">
        <div>
            <h1>Centros residenciales según tipo</h1>
            <h4>Datos de diciembre de 2025</h4>
        </div>
        <img src="logo.png" alt="Logo de Envejecimiento en red">
    </div>

    <!-- =================================================
         4. DESCRIPCIÓN

         Texto introductorio que explica qué información
         ofrece el mapa y se podria poner sustituyendo a las instrucciones
          de pulsar los botones, pero en este no hace falta
    ================================================== 

    <p class="descripcion">
        El mapa muestra la distribución territorial de los centros residenciales según su tipología.
    </p> -->


    <!-- =================================================
         5. MAPA DE DATAWRAPPER
         Inserción del mapa publicado en Datawrapper.
         Para sustituirlo por otra versión hay que
         actualizar el identificador correspondiente.
    ================================================== -->

    <div class="mapa">

        <div style="min-height:480px" id="datawrapper-vis-kuG3W">

            <script type="text/javascript" defer
            src="https://datawrapper.dwcdn.net/kuG3W/embed.js"
            charset="utf-8"
            data-target="#datawrapper-vis-kuG3W"></script>

            <!-- Imagen alternativa si no se ejecuta JavaScript que no voy a incluir
            <noscript>
                <img
                src="https://datawrapper.dwcdn.net/kuG3W/full.png"
                alt="Centros residenciales según tipo (Mapa coroplético)">
            </noscript>  -->

        </div>

    </div>

</div>

</body>
</html>

</div>

</body>
</html>
